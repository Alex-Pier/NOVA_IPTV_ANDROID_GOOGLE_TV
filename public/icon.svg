<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="94" stroke="url(#glow)" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- TV Bezel -->
  <rect x="76" y="96" width="360" height="248" rx="28" fill="#1e293b" stroke="url(#glow)" stroke-width="8" filter="url(#shadow)" />
  <rect x="92" y="112" width="328" height="216" rx="18" fill="#090d16" />
  
  <!-- Play & Signal Glow -->
  <path d="M225 175 L320 220 L225 265 Z" fill="url(#glow)" />
  
  <!-- TV Stand / Base -->
  <path d="M236 348 L276 348 L296 406 L216 406 Z" fill="#334155" />
  <rect x="180" y="406" width="152" height="18" rx="9" fill="url(#glow)" />

  <!-- Antennas / Signal Waves -->
  <path d="M216 94 L170 48" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <path d="M296 94 L342 48" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" />
  <circle cx="166" cy="44" r="8" fill="#38bdf8" />
  <circle cx="346" cy="44" r="8" fill="#a855f7" />

  <!-- Remote Mic Badge -->
  <circle cx="396" cy="380" r="46" fill="#06b6d4" filter="url(#shadow)" />
  <path d="M396 360 C391.5 360 388 363.5 388 368 L388 382 C388 386.5 391.5 390 396 390 C400.5 390 404 386.5 404 382 L404 368 C404 363.5 400.5 360 396 360 Z" fill="#ffffff" />
  <path d="M382 376 C382 383.7 388.3 390 396 390 C403.7 390 410 383.7 410 376" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M396 390 L396 398" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
</svg>
